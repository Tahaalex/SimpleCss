<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .container {
            display: flex;
            font-size: 0;
            
            height: 100vh;
            width: 100vw;
        }

        .div1 {
            display: inline-block;
            width: 40%;
            height: 100%;
            background-color: rgb(138, 255, 253);
            vertical-align: top;
        
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-right: 5px solid rgb(234, 221, 202);
            border-radius: 5px;

        }

        .div1-1 {
            width: 150px;
            height: 150px;
            position: absolute;
            top: 30%;
            transform: translateY(-40%);
            border-radius: 50%;
            background-image: url("baaan.png");


        }

        .div1-2 {
            height: 150px;
            width: 100%;

            position: relative;
            top: 100px;
        }

        .div1-3 {
            height: 150px;
            width: 100%;

            position: relative;
            top: -15px;
        }

        h1 {
            text-align: center;
            color: black;
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
        }

        .sub-container {
            display: inline-block;
            width: 59.34%;
            
            height: 100%;
            
            display: flex;
            flex-direction: column;
        }

        .div2 {
            width: 100%;
            
            height: 30%;
            border-radius: 5px;
            background-color: rgb(138, 255, 253);
            border-bottom: 4px solid rgb(234, 221, 202);
            border-left: 4px solid rgb(234, 221, 202);

        

        }

        .div3 {
            width: 100%;
            
            height: 70%;
            display: flex;
            justify-content: center;
        border: 4px solid rgb(234, 221, 202);
            border-radius: 5px;
            background-color: rgb(245, 245, 220); 

        }

        .div3 form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .div3 form input {
            border-radius: 2rem;
            margin: 10px;
            width: 300px;
            height: 40px;
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
        }

        .div2 h1 {
            text-align: bottom;
            color: black;
            font-size: 30px;
            font-family: 'Courier New', Courier, monospace;
            top: 50%;
            position: relative;
        }
        .sub {
    background-color: rgb(166, 255, 0);
    font-weight: bold;
    cursor: pointer;
    position: relative; 
   z-index: 10;
}

.sub:hover {
    background-color: rgb(200, 80, 0);
}
         
    </style>
</head>

<body>
    <div class="container">
        <div class="div1">
            <div class="div1-1"></div>
            <div class="div1-2">
                <H1>BANDIRMA ONYEDİ EYLÜL</H1>
            </div>
            <div class="div1-3">
                <h1>ÜNİVERSİTESİ</h1>
            </div>
        </div>
        <div class="sub-container">
            <div class="div2">
                <h1>BANDIRMA ONYEDİ EYLÜL ÜNİVERSİTESİ <br>ÖĞRENCİ GİRİŞ SAYFASI</h1>
            </div>
            <div class="div3">
                <form action="">
                    <div>
                        <h1 style="position: relative; right: 100%;top: 70px;">e posta:</h1><input type="text">
                    </div>
                    <div>
                        <h1 style="position: relative; right: 100%;top: 70px;">şifre:</h1><input type="password">
                    </div>
                    <input type="submit" value="giriş yap" class="sub" style="background-color:rgb(166, 255, 0);font-weight: bold;">
                </form>
            </div>
        </div>
    </div>
</body>

</html>
